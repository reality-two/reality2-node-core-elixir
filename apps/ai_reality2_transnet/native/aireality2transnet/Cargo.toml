[package]
name = "aireality2transnet"
version = "0.1.13"
authors = []
edition = "2021"

[lib]
name = "aireality2transnet"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.31"
rustler = "0.34.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
bluer = { version = "=0.17", features = ["bluetoothd"] }
uuid = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
