name: transnet_test
description: Test Sentant for Reality2 Transient Networking - ping/pong between nodes

events:
  - name: ping
    description: Send a ping to a remote node
  - name: pong
    description: Respond to a ping from a remote node
  - name: status
    description: Request transient networking status
  - name: discover
    description: Show discovered peers

automations:
  # Respond to ping with pong
  - name: respond_to_ping
    on: ping
    do:
      - log:
          message: "📩 PING received from remote node!"
          parameters: true
      - signal:
          event: pong
          parameters:
            message: "PONG from {{node_name}}"
            timestamp: "{{timestamp}}"
            node_id: "{{node_id}}"

  # Log pong response
  - name: handle_pong
    on: pong
    do:
      - log:
          message: "📬 PONG received! Transient networking works!"
          parameters: true

  # Show transient networking status
  - name: show_status
    on: status
    do:
      - log:
          message: "🔍 Transient Networking Status:"
      - log:
          message: "  Node ID: {{node_id}}"
      - log:
          message: "  Node Name: {{node_name}}"
      - log:
          message: "  Run 'discover' event to see peers"

  # Placeholder for peer discovery (actual implementation would query PeerManager)
  - name: show_peers
    on: discover
    do:
      - log:
          message: "🔍 Discovering nearby Reality2 nodes..."
      - log:
          message: "  Check logs for peer discovery messages"
      - log:
          message: "  Look for: [PeerManager] New peer discovered"
