sentant:
  name: Transnet Test
  data:
    timeout: 5000
  automations:
    - name: List Adapters
      description: List Bluetooth Adapters
      transitions:
        - public: true
          event: BLE Adapters
          actions:
            - command: list_adapters
              plugin: ai.reality2.transnet
    - name: Rescan
      description: Rescan for R2 nodes nearby
      transitions:
        - public: true
          event: Rescan
          actions:
            - command: reset_nodes
              plugin: ai.reality2.transnet
    - name: Scan
      description: Scan for a set period of time to find R2 nodes nearby
      transitions:
        - public: true
          event: Timed Scan
          parameters:
            timeout: number
          actions:
            - command: scan_nodes
              plugin: ai.reality2.transnet
    - name: Result
      transitions:
        - event: __internal
          actions:
            - command: signal
              parameters:
                event: result
                public: true
