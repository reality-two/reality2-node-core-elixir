sentant:
  name: Transnet Test
  description: Test and manage Bluetooth and WiFi networking capabilities for Reality2 Transient Networks
  data:
    timeout: 5000
  automations:
    # --------------------------------------------------------------------------------------------------
    # Bluetooth Operations
    # --------------------------------------------------------------------------------------------------
    - name: List BLE Adapters
      description: List Bluetooth Adapters
      transitions:
        - public: true
          event: BLE Adapters
          actions:
            - command: list_adapters
              plugin: ai.reality2.transnet
    - name: Rescan BLE
      description: Rescan for R2 nodes nearby
      transitions:
        - public: true
          event: Rescan
          actions:
            - command: reset_nodes
              plugin: ai.reality2.transnet
    - name: Scan BLE
      description: Scan for a set period of time to find R2 nodes nearby
      transitions:
        - public: true
          event: Timed Scan
          parameters:
            timeout: number
          actions:
            - command: scan_nodes
              plugin: ai.reality2.transnet

    # --------------------------------------------------------------------------------------------------
    # Results Handler
    # --------------------------------------------------------------------------------------------------
    - name: Result
      transitions:
        - event: __internal
          actions:
            - command: signal
              parameters:
                event: result
                public: true
