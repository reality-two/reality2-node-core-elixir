sentant:
  name: Transnet Test
  description: Test and manage Bluetooth and WiFi networking capabilities for Reality2 Transient Networks
  data:
    timeout: 5000
    ping_count: 0
  automations:
    # --------------------------------------------------------------------------------------------------
    # Cross-Node Test: Ping / Pong
    # --------------------------------------------------------------------------------------------------
    - name: Ping
      description: Respond to a ping with a pong signal
      transitions:
        - public: true
          event: ping
          actions:
            - command: set
              parameters:
                key: ping_count
                value:
                  jsonpath: "ping_count + 1"
            - command: send
              parameters:
                to: "@sender"
                event: pong
            - command: signal
              parameters:
                event: pong
                public: true

    - name: Echo
      description: Echo back any message sent to this sentant
      transitions:
        - public: true
          event: echo
          parameters:
            message: string
          actions:
            - command: send
              parameters:
                to: "@sender"
                event: echo_reply
            - command: signal
              parameters:
                event: echo_reply
                public: true

    # --------------------------------------------------------------------------------------------------
    # Bluetooth Operations
    # --------------------------------------------------------------------------------------------------
    - name: List BLE Adapters
      description: List Bluetooth Adapters
      transitions:
        - public: true
          event: BLE Adapters
          actions:
            - command: list_adapters
              plugin: ai.reality2.transnet
    - name: Rescan BLE
      description: Rescan for R2 nodes nearby
      transitions:
        - public: true
          event: Rescan
          actions:
            - command: reset_nodes
              plugin: ai.reality2.transnet
    - name: Scan BLE
      description: Scan for a set period of time to find R2 nodes nearby
      transitions:
        - public: true
          event: Timed Scan
          parameters:
            timeout: number
          actions:
            - command: scan_nodes
              plugin: ai.reality2.transnet

    # --------------------------------------------------------------------------------------------------
    # Results Handler
    # --------------------------------------------------------------------------------------------------
    - name: Result
      transitions:
        - event: __internal
          actions:
            - command: signal
              parameters:
                event: result
                public: true
